<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AD</title>
    <script>
      // Paint the theme background before React/Tailwind load so the window
      // doesn't flash white while the JS bundle initializes. Reads the same
      // persisted state used by useUiSettings (STORAGE_KEY in
      // src/store/uiSettings.ts) — fallback matches defaults.darkMode = true.
      (function () {
        try {
          var dark = true;
          var raw = localStorage.getItem('ad.ui-settings.v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (typeof parsed.darkMode === 'boolean') dark = parsed.darkMode;
          }
          var bg = dark ? '#1e1e2e' : '#eff1f5';
          var fg = dark ? '#cdd6f4' : '#4c4f69';
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.backgroundColor = bg;
          root.style.color = fg;
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <!-- This stays outside #root so the first frame survives React mounting. -->
    <div id="ad-splash">
      <style>
        #ad-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: grid;
          place-items: center;
          overflow: hidden;
          background: #eff1f5;
          color: #4c4f69;
          opacity: 1;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .dark #ad-splash {
          background: #1e1e2e;
          color: #cdd6f4;
        }
        #ad-splash.ad-splash-exit {
          opacity: 0;
          pointer-events: none;
          transition: opacity 260ms ease;
        }
        #root {
          opacity: 0;
          transition: opacity 260ms ease;
        }
        #root.ad-app-enter {
          opacity: 1;
        }
        #ad-splash-content {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 24px;
          transform: translateY(-3vh);
        }
        #ad-splash-logo {
          width: 88px;
          height: 88px;
          object-fit: contain;
          filter: drop-shadow(0 12px 30px rgb(76 79 105 / 0.18));
          animation: ad-logo-breathe 3.6s ease-in-out infinite;
        }
        .dark #ad-splash-logo {
          filter: drop-shadow(0 12px 30px rgb(17 17 27 / 0.42));
        }
        #ad-splash-quote {
          position: relative;
          margin: 0;
          color: #5c5f77;
          font-family: ui-serif, Georgia, 'Times New Roman', serif;
          font-size: 23px;
          font-weight: 500;
          line-height: 1.2;
          letter-spacing: 0.02em;
          white-space: nowrap;
        }
        .dark #ad-splash-quote {
          color: #a6adc8;
        }
        #ad-splash-status {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }
        @keyframes ad-logo-breathe {
          0%,
          100% {
            transform: scale(1);
          }
          50% {
            transform: scale(1.025);
          }
        }
        @supports ((-webkit-background-clip: text) or (background-clip: text)) {
          #ad-splash-quote {
            color: #5c5f77;
            background: linear-gradient(100deg, #5c5f77 34%, #11111b 49%, #209fb5 52%, #5c5f77 67%);
            background-size: 260% 100%;
            background-position: 140% 0;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
          }
          .dark #ad-splash-quote {
            background-image: linear-gradient(
              100deg,
              #a6adc8 34%,
              #fff 49%,
              #74c7ec 52%,
              #a6adc8 67%
            );
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #ad-splash-logo,
          #ad-splash-quote {
            animation: none;
          }
        }
      </style>
      <div id="ad-splash-content">
        <img id="ad-splash-logo" src="/ad-logo.png" alt="" aria-hidden="true" draggable="false" />
        <p id="ad-splash-quote" data-i18n-key="startup.loadingQuote">Be Water, My Friend</p>
      </div>
      <div
        id="ad-splash-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        data-i18n-key="startup.loadingStatus"
      >
        AD is loading
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
