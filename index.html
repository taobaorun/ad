<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AD</title>
    <script>
      // Paint the theme background before React/Tailwind load so the window
      // doesn't flash white while the JS bundle initializes. Reads the same
      // persisted state used by useUiSettings (STORAGE_KEY in
      // src/store/uiSettings.ts) — fallback matches defaults.darkMode = true.
      (function () {
        try {
          var dark = true;
          var raw = localStorage.getItem('ad.ui-settings.v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (typeof parsed.darkMode === 'boolean') dark = parsed.darkMode;
          }
          var bg = dark ? '#1e1e2e' : '#eff1f5';
          var fg = dark ? '#cdd6f4' : '#4c4f69';
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.backgroundColor = bg;
          root.style.color = fg;
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <!-- This stays outside #root so the first frame survives React mounting. -->
    <div id="ad-splash">
      <style>
        #ad-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: grid;
          place-items: center;
          overflow: hidden;
          background: #eff1f5;
          color: #4c4f69;
          opacity: 1;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .dark #ad-splash {
          background: #1e1e2e;
          color: #cdd6f4;
        }
        #ad-splash.ad-splash-exit {
          opacity: 0;
          pointer-events: none;
          transition: opacity 260ms ease;
        }
        #root {
          opacity: 0;
          transition: opacity 260ms ease;
        }
        #root.ad-app-enter {
          opacity: 1;
        }
        #ad-splash-content {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 24px;
          transform: translateY(-3vh);
        }
        #ad-splash-logo {
          width: 88px;
          height: 88px;
          object-fit: contain;
          filter: drop-shadow(0 12px 30px rgb(76 79 105 / 0.18));
        }
        .dark #ad-splash-logo {
          filter: drop-shadow(0 12px 30px rgb(17 17 27 / 0.42));
        }
        #ad-splash-quote-wrap {
          --ad-quote-base: #5c5f77;
          --ad-quote-highlight: #11111b;
          position: relative;
        }
        .dark #ad-splash-quote-wrap {
          --ad-quote-base: #a6adc8;
          --ad-quote-highlight: #fff;
        }
        #ad-splash-quote {
          margin: 0;
          color: #5c5f77;
          font-family: ui-serif, Georgia, 'Times New Roman', serif;
          font-size: 23px;
          font-weight: 500;
          line-height: 1.2;
          letter-spacing: 0.02em;
          white-space: nowrap;
        }
        .dark #ad-splash-quote {
          color: #a6adc8;
        }
        #ad-splash-quote-canvas {
          position: absolute;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
          pointer-events: none;
        }
        #ad-splash-status {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }
      </style>
      <div id="ad-splash-content">
        <img id="ad-splash-logo" src="/ad-logo.png" alt="" aria-hidden="true" draggable="false" />
        <div id="ad-splash-quote-wrap">
          <p id="ad-splash-quote" data-i18n-key="startup.loadingQuote">AD</p>
          <canvas id="ad-splash-quote-canvas" aria-hidden="true"></canvas>
        </div>
        <script>
          (function animateStartupQuote() {
            var wrap = document.getElementById('ad-splash-quote-wrap');
            var quote = document.getElementById('ad-splash-quote');
            var canvas = document.getElementById('ad-splash-quote-canvas');
            if (!wrap || !quote || !(canvas instanceof HTMLCanvasElement)) return;

            const sweepDurationMs = 600;
            const sweepRestMs = 300;
            const cycleDurationMs = sweepDurationMs + sweepRestMs;
            const frameIntervalMs = 16;
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function readFrameConfig() {
              var bounds = quote.getBoundingClientRect();
              var style = window.getComputedStyle(quote);
              var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
              var width = bounds.width;
              var height = bounds.height;
              canvas.style.width = width + 'px';
              canvas.style.height = height + 'px';
              var wrapStyle = window.getComputedStyle(wrap);
              return {
                text: quote.textContent || '',
                width: width,
                height: height,
                pixelWidth: Math.max(1, Math.round(width * pixelRatio)),
                pixelHeight: Math.max(1, Math.round(height * pixelRatio)),
                pixelRatio: pixelRatio,
                font:
                  style.font ||
                  [style.fontWeight, style.fontSize, style.fontFamily].filter(Boolean).join(' '),
                letterSpacing: style.letterSpacing,
                baseColor: wrapStyle.getPropertyValue('--ad-quote-base').trim(),
                highlightColor: wrapStyle.getPropertyValue('--ad-quote-highlight').trim(),
                reduceMotion: reduceMotion,
                sweepDurationMs: sweepDurationMs,
                cycleDurationMs: cycleDurationMs,
                frameIntervalMs: frameIntervalMs,
              };
            }

            function spotlightWorkerMain() {
              var canvas;
              var context;
              var config;
              var baseline = 0;
              var textX = 0;
              var startedAt = performance.now();
              var frameTimer;
              var frameIntervalMs = 16;
              var painted = false;

              function syncMetrics(nextConfig) {
                config = nextConfig;
                frameIntervalMs = config.frameIntervalMs;
                canvas.width = config.pixelWidth;
                canvas.height = config.pixelHeight;
                context.setTransform(config.pixelRatio, 0, 0, config.pixelRatio, 0, 0);
                context.font = config.font;
                context.textBaseline = 'alphabetic';
                if ('letterSpacing' in context) context.letterSpacing = config.letterSpacing;
                var metrics = context.measureText(config.text);
                textX = Math.max(0, (config.width - metrics.width) / 2);
                baseline =
                  (config.height +
                    metrics.actualBoundingBoxAscent -
                    metrics.actualBoundingBoxDescent) /
                  2;
              }

              function paintText(fillStyle) {
                context.fillStyle = fillStyle;
                context.fillText(config.text, textX, baseline);
              }

              function paintBand(center, bandWidth) {
                var gradient = context.createLinearGradient(
                  center - bandWidth / 2,
                  0,
                  center + bandWidth / 2,
                  0,
                );
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(0.18, 'transparent');
                gradient.addColorStop(0.34, config.highlightColor);
                gradient.addColorStop(0.66, config.highlightColor);
                gradient.addColorStop(0.82, 'transparent');
                gradient.addColorStop(1, 'transparent');
                paintText(gradient);
              }

              function paint(progress) {
                context.clearRect(0, 0, config.width, config.height);
                paintText(config.baseColor);
                if (!config.reduceMotion && progress !== null) {
                  var bandWidth = config.width * 0.55;
                  var center = -bandWidth / 2 + progress * (config.width + bandWidth);
                  paintBand(center, bandWidth);
                }
                if (!painted) {
                  painted = true;
                  self.postMessage({ type: 'painted' });
                }
              }

              function sweepProgressForElapsed(elapsedMs) {
                var cycleElapsed = elapsedMs % config.cycleDurationMs;
                if (cycleElapsed >= config.sweepDurationMs) return null;
                return cycleElapsed / config.sweepDurationMs;
              }

              function drawFrame() {
                paint(sweepProgressForElapsed(performance.now() - startedAt));
              }

              self.onmessage = function (event) {
                if (event.data.type === 'start') {
                  canvas = event.data.canvas;
                  context = canvas.getContext('2d');
                  if (!context) return;
                  syncMetrics(event.data.config);
                  paint(0);
                  if (!config.reduceMotion) {
                    frameTimer = self.setInterval(drawFrame, frameIntervalMs);
                  }
                } else if (event.data.type === 'update' && context) {
                  syncMetrics(event.data.config);
                  drawFrame();
                } else if (event.data.type === 'stop') {
                  self.clearInterval(frameTimer);
                  self.close();
                }
              };
            }

            function startWorkerAnimation() {
              if (
                typeof Worker !== 'function' ||
                typeof OffscreenCanvas !== 'function' ||
                typeof canvas.transferControlToOffscreen !== 'function'
              ) {
                return false;
              }

              var workerSource = '(' + spotlightWorkerMain.toString() + ')();';
              var workerUrl = URL.createObjectURL(
                new Blob([workerSource], { type: 'text/javascript' }),
              );
              var worker;
              try {
                worker = new Worker(workerUrl);
              } catch (_) {
                URL.revokeObjectURL(workerUrl);
                return false;
              }
              URL.revokeObjectURL(workerUrl);

              var offscreenCanvas;
              try {
                offscreenCanvas = canvas.transferControlToOffscreen();
              } catch (_) {
                worker.terminate();
                return false;
              }

              var resizeObserver;
              var textObserver;
              var removalObserver;
              var stopped = false;

              function stopWorker() {
                if (stopped) return;
                stopped = true;
                worker.postMessage({ type: 'stop' });
                worker.terminate();
                resizeObserver?.disconnect();
                textObserver?.disconnect();
                removalObserver?.disconnect();
              }

              function updateWorker() {
                if (!canvas.isConnected) {
                  stopWorker();
                  return;
                }
                worker.postMessage({ type: 'update', config: readFrameConfig() });
              }

              worker.onmessage = function (event) {
                if (event.data.type === 'painted' && canvas.dataset.settled !== 'true') {
                  quote.style.color = 'transparent';
                }
              };
              worker.onerror = function () {
                quote.style.color = '';
                canvas.style.display = 'none';
                stopWorker();
              };
              worker.postMessage(
                { type: 'start', canvas: offscreenCanvas, config: readFrameConfig() },
                [offscreenCanvas],
              );

              if (typeof ResizeObserver === 'function') {
                resizeObserver = new ResizeObserver(updateWorker);
                resizeObserver.observe(quote);
              }
              textObserver = new MutationObserver(updateWorker);
              textObserver.observe(quote, { childList: true, characterData: true, subtree: true });
              removalObserver = new MutationObserver(function () {
                if (!canvas.isConnected || canvas.dataset.settled === 'true') stopWorker();
              });
              removalObserver.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['data-settled'],
              });
              return true;
            }

            function startMainThreadFallback() {
              var context = canvas.getContext('2d');
              if (!context) return;
              var config;
              var baseline = 0;
              var textX = 0;
              var startedAt = performance.now();
              var frameTimer;
              var resizeObserver;
              var textObserver;
              var themeObserver;

              function syncMetrics() {
                config = readFrameConfig();
                canvas.width = config.pixelWidth;
                canvas.height = config.pixelHeight;
                context.setTransform(config.pixelRatio, 0, 0, config.pixelRatio, 0, 0);
                context.font = config.font;
                context.textBaseline = 'alphabetic';
                if ('letterSpacing' in context) context.letterSpacing = config.letterSpacing;
                var metrics = context.measureText(config.text);
                textX = Math.max(0, (config.width - metrics.width) / 2);
                baseline =
                  (config.height +
                    metrics.actualBoundingBoxAscent -
                    metrics.actualBoundingBoxDescent) /
                  2;
              }

              function paintText(fillStyle) {
                context.fillStyle = fillStyle;
                context.fillText(config.text, textX, baseline);
              }

              function paintBand(center, bandWidth) {
                var gradient = context.createLinearGradient(
                  center - bandWidth / 2,
                  0,
                  center + bandWidth / 2,
                  0,
                );
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(0.18, 'transparent');
                gradient.addColorStop(0.34, config.highlightColor);
                gradient.addColorStop(0.66, config.highlightColor);
                gradient.addColorStop(0.82, 'transparent');
                gradient.addColorStop(1, 'transparent');
                paintText(gradient);
              }

              function paint(progress) {
                context.clearRect(0, 0, config.width, config.height);
                paintText(config.baseColor);
                if (reduceMotion || progress === null) return;
                var bandWidth = config.width * 0.55;
                var center = -bandWidth / 2 + progress * (config.width + bandWidth);
                paintBand(center, bandWidth);
              }

              function stopAnimation() {
                window.clearInterval(frameTimer);
                window.removeEventListener('focus', drawFrame);
                document.removeEventListener('visibilitychange', handleVisibilityChange);
                resizeObserver?.disconnect();
                textObserver?.disconnect();
                themeObserver?.disconnect();
              }

              function sweepProgressForElapsed(elapsedMs) {
                var cycleElapsed = elapsedMs % cycleDurationMs;
                if (cycleElapsed >= sweepDurationMs) return null;
                return cycleElapsed / sweepDurationMs;
              }

              function drawFrame() {
                if (!canvas.isConnected || canvas.dataset.settled === 'true') {
                  stopAnimation();
                  return;
                }
                paint(sweepProgressForElapsed(performance.now() - startedAt));
              }

              function refreshFallbackConfig() {
                if (!canvas.isConnected || canvas.dataset.settled === 'true') {
                  stopAnimation();
                  return;
                }
                syncMetrics();
                drawFrame();
              }

              function handleVisibilityChange() {
                if (!document.hidden) drawFrame();
              }

              syncMetrics();
              paint(0);
              quote.style.color = 'transparent';
              if (!reduceMotion) {
                frameTimer = window.setInterval(drawFrame, frameIntervalMs);
                window.addEventListener('focus', drawFrame);
                document.addEventListener('visibilitychange', handleVisibilityChange);
              }
              if (typeof ResizeObserver === 'function') {
                resizeObserver = new ResizeObserver(refreshFallbackConfig);
                resizeObserver.observe(quote);
              }
              textObserver = new MutationObserver(refreshFallbackConfig);
              textObserver.observe(quote, {
                childList: true,
                characterData: true,
                subtree: true,
              });
              themeObserver = new MutationObserver(refreshFallbackConfig);
              themeObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['class', 'style'],
              });
            }

            if (!startWorkerAnimation()) startMainThreadFallback();
          })();
        </script>
      </div>
      <div
        id="ad-splash-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        data-i18n-key="startup.loadingStatus"
      >
        …
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
